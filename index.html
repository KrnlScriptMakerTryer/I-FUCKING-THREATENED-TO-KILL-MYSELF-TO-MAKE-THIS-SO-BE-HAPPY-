<!DOCTYPE html>
<html>
<head>
    <title>Sora 2 Text → Video</title>
    <style>
        body {
            font-family: Arial;
            background: #111;
            color: white;
            padding: 20px;
        }
        textarea {
            width: 100%;
            height: 120px;
            font-size: 16px;
            padding: 10px;
        }
        button {
            padding: 10px 20px;
            font-size: 18px;
            margin-top: 10px;
        }
        video {
            width: 100%;
            margin-top: 20px;
        }
        #progressContainer {
            width: 100%;
            background-color: #333;
            border-radius: 5px;
            margin-top: 10px;
            height: 25px;
            overflow: hidden;
        }
        #progressBar {
            height: 100%;
            width: 0%;
            background-color: #4caf50;
            text-align: center;
            line-height: 25px;
            color: white;
        }
    </style>
</head>
<body>

<h1>Sora 2 Text → Video Generator</h1>

<p>Enter prompt:</p>
<textarea id="prompt"></textarea>

<button onclick="generate()">Generate Video</button>

<div id="progressContainer">
    <div id="progressBar">0%</div>
</div>

<p id="status"></p>
<video id="video" controls></video>

<script>
async function generate() {
    let prompt = document.getElementById("prompt").value;
    let status = document.getElementById("status");
    let progressBar = document.getElementById("progressBar");
    
    if (!prompt) {
        alert("Enter a prompt!");
        return;
    }

    status.innerHTML = "Generating video…";
    progressBar.style.width = "0%";
    progressBar.innerText = "0%";

    // ⚠️ PUT YOUR API KEY BETWEEN THE QUOTES BELOW ⚠️
    const API_KEY = "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";

    // Simulate progress while waiting
    let progress = 0;
    const interval = setInterval(() => {
        progress = Math.min(progress + Math.floor(Math.random() * 10), 95); // up to 95%
        progressBar.style.width = progress + "%";
        progressBar.innerText = progress + "%";
    }, 500);

    try {
        const response = await fetch("https://api.openai.com/v1/videos", {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "Authorization": "Bearer " + API_KEY
            },
            body: JSON.stringify({
                model: "sora-2",
                prompt: prompt
            })
        });

        const data = await response.json();
        console.log(data);

        clearInterval(interval);
        progressBar.style.width = "100%";
        progressBar.innerText = "100%";

        if (!data.video_url) {
            status.innerHTML = "Error: " + JSON.stringify(data);
            return;
        }

        status.innerHTML = "Video generated!";
        document.getElementById("video").src = data.video_url;
    } catch (err) {
        clearInterval(interval);
        status.innerHTML = "Error: " + err;
        progressBar.style.width = "0%";
        progressBar.innerText = "0%";
    }
}
</script>

</body>
</html>
