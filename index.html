<!DOCTYPE html>
<html>
<head>
    <title>Sora 2 Text → Video</title>
    <style>
        body {
            font-family: Arial;
            background: #111;
            color: white;
            padding: 20px;
        }
        textarea {
            width: 100%;
            height: 120px;
            font-size: 16px;
            padding: 10px;
        }
        button {
            padding: 10px 20px;
            font-size: 18px;
            margin-top: 10px;
        }
        video {
            width: 100%;
            margin-top: 20px;
        }
    </style>
</head>
<body>

<h1>Sora 2 Text → Video Generator</h1>

<p>Enter prompt:</p>
<textarea id="prompt"></textarea>

<button onclick="generate()">Generate Video</button>

<p id="status"></p>
<video id="video" controls></video>

<script>
async function generate() {
    let prompt = document.getElementById("prompt").value;
    let status = document.getElementById("status");
    status.innerHTML = "Generating video… please wait";

    // ⚠️ PUT YOUR API KEY BETWEEN THE QUOTES BELOW ⚠️
    const API_KEY = "sk-Eg1jkXNz4sQIFhY2YHnDujcELFQICIkW";

    const response = await fetch("https://api.openai.com/v1/videos", {
        method: "POST",
        headers: {
            "Content-Type": "application/json",
            "Authorization": "Bearer " + API_KEY
        },
        body: JSON.stringify({
            model: "sora-2",
            prompt: prompt
        })
    });

    const data = await response.json();
    console.log(data);

    if (!data.video_url) {
        status.innerHTML = "Error: " + JSON.stringify(data);
        return;
    }

    status.innerHTML = "Video generated!";
    document.getElementById("video").src = data.video_url;
}
</script>

</body>
</html>
